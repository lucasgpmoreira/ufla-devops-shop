# Nginx na frente da api. "api" e o nome do servico no compose.yaml;
# localhost aqui dentro seria o proprio container do nginx.
upstream loja_api {
    server api:8000;
}

# As rotas do FastAPI so aceitam GET, entao um HEAD (curl -I) dava 405.
# O nginx repassa HEAD como GET e devolve so os cabecalhos pro cliente.
map $request_method $metodo_upstream {
    HEAD    GET;
    default $request_method;
}

server {
    listen 80;
    server_name _;

    location / {
        proxy_pass http://loja_api;
        proxy_method $metodo_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
