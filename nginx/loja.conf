# Proxy reverso do ufla-devops-shop.
# Instalado pelo deploy.sh em /etc/nginx/sites-available/loja.conf.
# A aplicacao escuta so em 127.0.0.1:8000 --- de fora, so se chega por aqui.

server {
    listen 80;
    listen [::]:80;
    server_name localhost;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name localhost;

    ssl_certificate     /etc/ssl/ufla-shop/loja.crt;
    ssl_certificate_key /etc/ssl/ufla-shop/loja.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    access_log /var/log/nginx/loja-access.log;
    error_log  /var/log/nginx/loja-error.log;

    location / {
        proxy_pass http://127.0.0.1:8000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
